<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Simpson's Rule Simulator</title>
    <script defer src="https://unpkg.com/mathlive"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    
    <style>
        :root {
            --bg: #1e1e2e;
            --panel: #282a36;
            --text: #f8f8f2;
            --accent: #bd93f9;
            --success: #50fa7b;
            --danger: #ff5555;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 5px;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            margin-top: 20px;
        }
        .panel {
            background-color: var(--panel);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .visualization {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-weight: bold;
            font-size: 0.9em;
            color: #8be9fd;
        }
        math-field {
            font-size: 1.2rem;
            background: #fff;
            color: #000;
            border-radius: 5px;
            padding: 5px;
            border: 2px solid transparent;
        }
        input[type="number"] {
            background: #44475a;
            color: #fff;
            border: 1px solid #6272a4;
            padding: 8px;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        .results {
            margin-top: 20px;
            background: #44475a;
            padding: 15px;
            border-radius: 5px;
        }
        .results p { margin: 5px 0; }
        .val { color: var(--success); font-family: monospace; font-size: 1.1em;}
        canvas {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <h1>Adaptive Simpson's Rule</h1>
    <p>Simulate the adaptive integration of a LaTeX mathematical function.</p>

    <div class="container">
        <div class="panel controls">
            <label>Function f(x) (LaTeX format):</label>
            <math-field id="latex-input">\sin(x^2)</math-field>
            
            <label>Lower Bound (a):</label>
            <input type="number" id="bound-a" value="0" step="0.1">
            
            <label>Upper Bound (b):</label>
            <input type="number" id="bound-b" value="4" step="0.1">
            
            <label>Tolerance (ε):</label>
            <input type="number" id="tolerance" value="0.001" step="0.0001">

            <button id="run-btn">Run Simulation</button>

            <div class="results" id="results-box" style="display: none;">
                <p>Approximation: <span id="res-approx" class="val"></span></p>
                <p>Estimated Error: <span id="res-error" class="val" style="color:var(--danger)"></span></p>
                <p>Nodes Evaluated: <span id="res-nodes" class="val" style="color:#8be9fd"></span></p>
                <p>Singularities at X: <span id="res-sing" class="val" style="color:#ffb86c"></span></p>
            </div>
        </div>

        <div class="panel visualization">
            <canvas id="graphCanvas" width="700" height="500"></canvas>
        </div>
    </div>

    <script>
        // DOM Elements
        const mathField = document.getElementById('latex-input');
        const btnRun = document.getElementById('run-btn');
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        
        let animationId;
        let animationInterval;

        // Basic LaTeX to Math.js parser
        function parseLatexToMathJS(latex) {
            let parsed = latex
                .replace(/\\cdot/g, '*')
                .replace(/\\left\(/g, '(')
                .replace(/\\right\)/g, ')')
                .replace(/\\sin/g, 'sin')
                .replace(/\\cos/g, 'cos')
                .replace(/\\tan/g, 'tan')
                .replace(/\\exp/g, 'exp')
                .replace(/\\ln/g, 'log')
                .replace(/\\pi/g, 'pi')
                .replace(/\\sqrt{([^}]+)}/g, 'sqrt($1)');
            
            // Handle simple fractions \frac{a}{b} -> (a)/(b)
            // Note: Does not support highly nested fractions automatically
            parsed = parsed.replace(/\\frac{([^{}]+)}{([^{}]+)}/g, '($1)/($2)');
            
            return parsed;
        }

        // Evaluate the compiled math expression safely
        function evaluateFunc(compiledCode, xValue) {
            try {
                return compiledCode.evaluate({ x: xValue });
            } catch (err) {
                return NaN;
            }
        }

        // Adaptive Simpson's Rule Logic
        function runAdaptiveSimpson(compiledCode, a, b, tol) {
            let steps = [];
            let nodes = new Set();
            let singularities = [];
            let totalError = 0;
            let maxDepth = 15;

            function f(x) {
                // Track nodes
                nodes.add(x);
                let val = evaluateFunc(compiledCode, x);
                if (!isFinite(val) || isNaN(val)) {
                    singularities.push(x);
                    val = 0; // Prevent full crash, treat as zero or handle gracefully
                }
                return val;
            }

            function recurse(a, b, eps, S, fa, fb, fc, depth) {
                let c = (a + b) / 2;
                let h = b - a;
                let d = (a + c) / 2;
                let e = (c + b) / 2;

                let fd = f(d);
                let fe = f(e);

                let leftS = (h / 12) * (fa + 4 * fd + fc);
                let rightS = (h / 12) * (fc + 4 * fe + fb);
                let S2 = leftS + rightS;

                if (depth <= 0 || Math.abs(S2 - S) <= 15 * eps) {
                    // Record step for animation
                    steps.push({ a, b, c, fa, fb, fc, leftS, rightS });
                    totalError += Math.abs(S2 - S) / 15;
                    return S2 + (S2 - S) / 15;
                }

                return recurse(a, c, eps / 2, leftS, fa, fc, fd, depth - 1) +
                       recurse(c, b, eps / 2, rightS, fc, fb, fe, depth - 1);
            }

            let c = (a + b) / 2;
            let fa = f(a), fb = f(b), fc = f(c);
            let S = (b - a) / 6 * (fa + 4 * fc + fb);

            let result = recurse(a, b, tol, S, fa, fb, fc, maxDepth);

            // Filter unique singularities to 4 decimals
            let uniqueSingularities = [...new Set(singularities.map(s => Number(s.toFixed(4))))];

            return { result, error: totalError, nodes: nodes.size, singularities: uniqueSingularities, steps };
        }

        // Drawing / Animation Logic
        function simulateGraph(compiledCode, a, b, resultData) {
            clearInterval(animationInterval);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const padding = 40;
            const width = canvas.width - padding * 2;
            const height = canvas.height - padding * 2;

            // Generate points for the true curve
            const points = 500;
            let trueCurve = [];
            let minY = Infinity;
            let maxY = -Infinity;

            for (let i = 0; i <= points; i++) {
                let x = a + (b - a) * (i / points);
                let y = evaluateFunc(compiledCode, x);
                if (isFinite(y)) {
                    trueCurve.push({x, y});
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }

            // Adjust bounds for padding
            let yRange = maxY - minY;
            if (yRange === 0) yRange = 1;
            minY -= yRange * 0.1;
            maxY += yRange * 0.1;

            // Coordinate mapping functions
            const mapX = (x) => padding + ((x - a) / (b - a)) * width;
            const mapY = (y) => canvas.height - padding - ((y - minY) / (maxY - minY)) * height;

            // Draw Axes
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            let yZero = mapY(0);
            if (yZero > padding && yZero < canvas.height - padding) {
                ctx.moveTo(padding, yZero);
                ctx.lineTo(canvas.width - padding, yZero);
            }
            ctx.stroke();

            // Draw True Curve
            ctx.strokeStyle = '#44475a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            trueCurve.forEach((pt, index) => {
                if (index === 0) ctx.moveTo(mapX(pt.x), mapY(pt.y));
                else ctx.lineTo(mapX(pt.x), mapY(pt.y));
            });
            ctx.stroke();

            // Function to evaluate quadratic parabola for Simpson's rule at given x
            function evaluateParabola(px, x1, y1, x2, y2, x3, y3) {
                const term1 = y1 * ((px - x2) * (px - x3)) / ((x1 - x2) * (x1 - x3));
                const term2 = y2 * ((px - x1) * (px - x3)) / ((x2 - x1) * (x2 - x3));
                const term3 = y3 * ((px - x1) * (px - x2)) / ((x3 - x1) * (x3 - x2));
                return term1 + term2 + term3;
            }

            // Animation Loop
            let stepIndex = 0;
            const steps = resultData.steps;

            animationInterval = setInterval(() => {
                if (stepIndex >= steps.length) {
                    clearInterval(animationInterval);
                    return;
                }

                let step = steps[stepIndex];
                
                // Draw filled parabola area
                ctx.fillStyle = 'rgba(189, 147, 249, 0.4)'; // Accent color transparent
                ctx.strokeStyle = '#bd93f9';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(mapX(step.a), mapY(0));
                
                for(let px = step.a; px <= step.b; px += (step.b - step.a)/50) {
                    let py = evaluateParabola(px, step.a, step.fa, step.c, step.fc, step.b, step.fb);
                    ctx.lineTo(mapX(px), mapY(py));
                }
                
                ctx.lineTo(mapX(step.b), mapY(step.fb));
                ctx.lineTo(mapX(step.b), mapY(0));
                ctx.fill();
                
                // Draw parabola edge
                ctx.beginPath();
                for(let px = step.a; px <= step.b; px += (step.b - step.a)/50) {
                    let py = evaluateParabola(px, step.a, step.fa, step.c, step.fc, step.b, step.fb);
                    if(px === step.a) ctx.moveTo(mapX(px), mapY(py));
                    else ctx.lineTo(mapX(px), mapY(py));
                }
                ctx.stroke();

                stepIndex++;
            }, 100); // 100ms per step
        }

        // Run Event
        btnRun.addEventListener('click', () => {
            const latexStr = mathField.getValue('latex');
            const mathStr = parseLatexToMathJS(latexStr);
            
            const a = parseFloat(document.getElementById('bound-a').value);
            const b = parseFloat(document.getElementById('bound-b').value);
            const tol = parseFloat(document.getElementById('tolerance').value);

            try {
                // Compile the math expression using math.js
                const compiledCode = math.compile(mathStr);

                // Run Adaptive Simpson
                const results = runAdaptiveSimpson(compiledCode, a, b, tol);

                // Update UI
                document.getElementById('results-box').style.display = 'block';
                document.getElementById('res-approx').innerText = results.result.toFixed(6);
                document.getElementById('res-error').innerText = results.error.toExponential(4);
                document.getElementById('res-nodes').innerText = results.nodes;
                document.getElementById('res-sing').innerText = results.singularities.length > 0 ? results.singularities.join(', ') : 'None detected';

                // Visualize
                simulateGraph(compiledCode, a, b, results);

            } catch (err) {
                alert("Error parsing or evaluating the mathematical expression. Please ensure it's valid standard math formatting.");
                console.error(err);
            }
        });
    </script>
</body>
</html>
